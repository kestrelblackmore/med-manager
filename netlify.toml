[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.x"

[functions]
  node_bundler = "esbuild"
  
[[redirects]]
  from = "/_redirects"
  to = "/"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"